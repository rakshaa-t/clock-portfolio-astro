<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Base warm gradient -->
    <radialGradient id="base" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#C4B8E8"/>
      <stop offset="45%" stop-color="#8B7EC8"/>
      <stop offset="100%" stop-color="#4A3D7A"/>
    </radialGradient>

    <!-- Warm accent glow -->
    <radialGradient id="warm" cx="75%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#F0D080" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#E0B850" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B7EC8" stop-opacity="0"/>
    </radialGradient>

    <!-- Top highlight -->
    <radialGradient id="highlight" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#E6DFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B7EC8" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep shadow -->
    <radialGradient id="depth" cx="85%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#2A1F4E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A3D7A" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="soft-light" result="noisy"/>
      <feComponentTransfer in="noisy">
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="" mode="normal"/>
    </filter>

    <!-- Soft inner glow for depth -->
    <radialGradient id="centerGlow" cx="45%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#B8AAFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B7EC8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#base)"/>

  <!-- Warm overlay -->
  <circle cx="200" cy="200" r="200" fill="url(#warm)"/>

  <!-- Highlight -->
  <circle cx="200" cy="200" r="200" fill="url(#highlight)"/>

  <!-- Depth shadow -->
  <circle cx="200" cy="200" r="200" fill="url(#depth)"/>

  <!-- Center glow -->
  <circle cx="200" cy="200" r="200" fill="url(#centerGlow)"/>

  <!-- Subtle grain overlay -->
  <circle cx="200" cy="200" r="200" filter="url(#noise)" fill="transparent"/>
</svg>
